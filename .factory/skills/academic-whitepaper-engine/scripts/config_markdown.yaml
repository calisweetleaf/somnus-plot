# config.yaml
# PDF to Markdown Converter Configuration

# Input settings
input:
  # Directories to scan for PDFs
  directories:
    - ./input_pdfs
  
  # File patterns to include
  patterns:
    - "*.pdf"
    - "*.PDF"
  
  # Recursive scanning
  recursive: true
  
  # Maximum file size (MB)
  max_file_size_mb: 100

# OCR settings
ocr:
  # Image processing
  dpi: 300
  language: eng
  
  # Multiple languages (space-separated)
  # languages: eng+fra+spa
  
  # OCR engine mode (0-3)
  # 0 = Legacy engine only
  # 1 = Neural nets LSTM engine only
  # 2 = Legacy + LSTM engines
  # 3 = Default, based on what is available
  engine_mode: 3
  
  # Page segmentation mode (0-13)
  # 1 = Automatic page segmentation with OSD
  # 3 = Fully automatic page segmentation, no OSD (Default)
  # 6 = Assume a single uniform block of text
  page_segmentation_mode: 3
  
  # Preprocessing
  preprocess: true
  preprocessing_steps:
    - grayscale
    - denoise
    - threshold
    - deskew
  
  # Confidence threshold (0-100)
  min_confidence: 60
  
  # Timeout per page (seconds)
  timeout_per_page: 30

# Markdown formatting
formatting:
  # Heading detection
  heading_levels:
    h1: "#"
    h2: "##"
    h3: "###"
    h4: "####"
    h5: "#####"
  
  # Structure detection
  detect_tables: true
  detect_lists: true
  detect_code: true
  detect_quotes: true
  detect_headers_footers: true
  
  # Text cleaning
  clean_whitespace: true
  preserve_line_breaks: false
  fix_common_ocr_errors: true
  remove_page_numbers: true
  
  # Line wrapping
  max_line_length: 80
  wrap_long_lines: true
  
  # Table formatting
  table_format: "github"  # github, simple, grid
  
  # Code block detection
  code_languages:
    - python
    - javascript
    - java
    - cpp
    - bash
    - sql

# Output settings
output:
  # Directory structure
  create_subdirectories: true
  subdirectories:
    markdown: "converted"
    metadata: "metadata"
    assets: "assets"
    logs: "logs"
    backups: "backups"
  
  # File naming
  filename_template: "{original_name}_{timestamp}_{hash}"
  timestamp_format: "%Y%m%d_%H%M%S"
  hash_length: 8
  
  # Content options
  include_metadata: true
  include_toc: true
  toc_depth: 3
  include_page_numbers: false
  
  # Splitting options
  split_by_heading: false
  max_file_size_mb: 5
  
  # Archive options
  create_archive: true
  archive_format: "zip"  # zip, tar, tar.gz
  include_original: false
  
  # Backup options
  keep_backups: true
  max_backups: 5

# Processing settings
processing:
  # Concurrency
  max_concurrent: 2
  max_concurrent_pages: 4
  
  # Error handling
  retry_failed: true
  max_retries: 2
  skip_problematic_pages: true
  
  # Resource limits
  memory_limit_mb: 4096
  timeout_per_file: 300
  
  # Progress reporting
  show_progress: true
  progress_interval: 5

# Metadata extraction
metadata:
  # Extract from PDF
  extract_pdf_metadata: true
  extract_xmp_metadata: true
  
  # Custom metadata
  custom_tags:
    department: "Document Processing"
    processed_by: "PDF to Markdown Converter"
    version: "1.0"
    location: "Server"
  
  # Hash algorithms
  compute_hashes:
    - sha256
    - md5
    - sha1
  
  # Statistics to compute
  statistics:
    - word_count
    - page_count
    - character_count
    - paragraph_count
    - section_count
    - image_count

# Logging settings
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  file: "conversion.log"
  max_size_mb: 10
  backup_count: 5
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  
  # Separate log files
  separate_logs: true
  log_files:
    errors: "errors.log"
    debug: "debug.log"
    statistics: "stats.log"

# Notification settings (optional)
notifications:
  email:
    enabled: false
    smtp_server: "smtp.gmail.com"
    smtp_port: 587
    sender: "converter@example.com"
    recipients:
      - "admin@example.com"
    on_success: true
    on_failure: true
    on_completion: true
  
  webhook:
    enabled: false
    url: "https://hooks.slack.com/services/..."
    events:
      - start
      - success
      - failure
      - completion

# Advanced settings
advanced:
  # Text extraction heuristics
  heading_threshold: 1.5  # Font size multiplier for heading detection
  list_indent_threshold: 20  # Pixels
  table_column_threshold: 50  # Minimum pixel difference for columns
  
  # Language detection
  detect_language: true
  fallback_language: "eng"
  
  # Image extraction
  extract_images: false
  image_format: "png"
  image_quality: 85
  
  # Post-processing
  spell_check: false
  grammar_check: false
  auto_correct: false
  
  # Quality assurance
  validate_markdown: true
  check_links: false
  verify_structure: true