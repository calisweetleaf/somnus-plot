engine_revision: "v4-proposed"
status: "audit-complete_voice-calibration-pending"
canonical_pipeline:
  manuscript: markdown
  conversion: pandoc_ast_or_controlled_parser
  tex_engine: lualatex
  bibliography: biblatex_biber
  build_driver: latexmk
  publication_source: tex
  compiled_artifact: pdf

p0_contract_repairs:
  - unify_tex_toolchain
  - create_real_pandoc_template
  - remove_import_time_dependency_installation
  - fix_math_fence_parser
  - remove_unsafe_bare_math_rewriting
  - fix_cross_reference_registry
  - complete_bibliography_build_graph
  - add_repository_self_check
  - resolve_missing_referenced_files
  - replace_unpinned_dependency_policy_with_lockfile

p1_workflow_state:
  artifacts:
    - reconnaissance.json
    - authority-map.yaml
    - thesis-contract.md
    - claim-ledger.yaml
    - visual-ledger.yaml
    - section-graph.yaml
    - build-manifest.json
    - validation-report.json
  editorial_passes:
    - architecture
    - claim_temperature
    - authorial_cadence
    - compression
    - counter_reading
    - citations
    - visuals
    - mathematics

claim_classes:
  - implemented
  - observed
  - derived
  - interpretive
  - hypothesized
  - planned
  - comparative
  - historical

visual_policy:
  body_text: monochrome
  headings: monochrome
  hyperlinks: monochrome
  equations: monochrome
  code_boxes: color_allowed
  diagrams: color_allowed_when_semantic
  plots: color_allowed_when_semantic
  grayscale_fallback_required: true

voice_calibration:
  required_inputs:
    - fully_daeron_authored_whitepaper
    - codex_authored_whitepaper
  outputs:
    - authorial-cadence-profile.md
    - authorial-cadence-profile.yaml
    - codex-drift-patterns.md
    - before-after-revision-examples.md
  status: pending

anti_genericity_review:
  purpose: "authorship consistency and generic prose risk, not detector evasion"
  checks:
    - sentence_length_uniformity
    - paragraph_template_repetition
    - generic_transitions
    - excessive_heading_fragmentation
    - inflated_adjectives
    - citation_wallpaper
    - unsupported_certainty
    - conclusion_restatement
    - cadence_drift
