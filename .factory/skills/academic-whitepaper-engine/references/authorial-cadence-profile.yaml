# Authorial Cadence Profile — Machine-Readable Specification
# Used by whitepaper_engine/style_review.py for automated cadence checking

version: "1.0"
profile_name: "daeron-somnus"
calibration_status: "pending"  # Requires two-paper comparison for full calibration

# --- Sentence Cadence Targets ---
sentence_cadence:
  mean_length:
    target_min: 18
    target_max: 26
    unit: words
  standard_deviation:
    minimum: 8
    note: "High variance is a signature — uniform sentence lengths are flagged"
  short_terminal:
    enabled: true
    max_words: 8
    description: "Short declarative anchors after complex compound sentences"
  max_sentence_length: 60
  min_sentence_length: 3

# --- Paragraph Architecture ---
paragraph_architecture:
  mean_length:
    target_min: 4
    target_max: 7
    unit: sentences
  first_sentence_function: "thesis_or_object_introduction"
  last_sentence_function: "anchor_or_transition_or_qualification"
  internal_structure: "claim → mechanism → evidence → scope_boundary"
  uniformity_flag_threshold: 0.15  # Flag if paragraph length std/mean < this

# --- Argument Movement ---
argument_movement:
  canonical_sequence:
    - "establish_exact_object"
    - "identify_insufficient_regime"
    - "define_new_object_without_inflation"
    - "expose_mechanism_before_implications"
    - "formalize_selectively"
    - "separate_behavioral_categories"
    - "return_to_opening_narrower_stronger"
  anti_patterns:
    - "broad_historical_introduction"
    - "generic_gap_statement"
    - "contribution_enumeration_list"
    - "architecture_then_optimistic_conclusion"

# --- Transition Vocabulary ---
transitions:
  permitted:
    - "The question then becomes"
    - "This leads to"
    - "What remains is"
    - "However"
    - "But this assumes"
    - "The distinction is"
    - "The result is"
    - "This means"
    - "Therefore"
    - "First"
    - "Then"
    - "Before that"
  forbidden_ai_fingerprints:
    - "Furthermore,"
    - "Moreover,"
    - "Additionally,"
    - "Delving deeper"
    - "It is worth noting"
    - "Notably,"
    - "Importantly,"
    - "In this context,"
    - "It should be noted"
    - "This highlights"
    - "This underscores"
    - "This demonstrates"
    - "plays a crucial role"
    - "It is important to note"
    - "a testament to"
    - "the intricacies of"
    - "a comprehensive"
    - "a nuanced"
    - "a holistic"
    - "delve into"
    - "tapestry"
    - "multifaceted"
    - "leverage"
    - "groundbreaking"
    - "cutting-edge"
    - "game-changing"
    - "paradigm shift"
    - "synergy"
    - "This is not merely"
    - "at the heart of"
    - "at its core"

# --- Negative Definition ---
negative_definition:
  max_negations_per_passage: 4
  must_follow_with_positive: true
  use_cases:
    - "adjacent_category_disambiguation"
    - "misleading_connotation_correction"
    - "boundary_more_informative_than_center"

# --- Formalism Rules ---
formalism:
  placement_rule: "earliest_point_removing_ambiguity"
  equation_must_have_interpretation: true
  notation_introduced_inline_first: true
  no_decorative_equations: true

# --- Claim Temperature ---
claim_temperature:
  classes:
    implemented:
      permitted_temperature: ["cold", "measured"]
      permitted_tense: ["present"]
    observed:
      permitted_temperature: ["cold", "measured"]
      permitted_tense: ["past", "present"]
    derived:
      permitted_temperature: ["measured"]
      permitted_tense: ["present"]
    interpretive:
      permitted_temperature: ["measured", "warm"]
      permitted_tense: ["present"]
    hypothesized:
      permitted_temperature: ["warm"]
      permitted_tense: ["conditional", "subjunctive"]
    planned:
      permitted_temperature: ["measured"]
      permitted_tense: ["future", "conditional"]
    comparative:
      permitted_temperature: ["measured"]
      permitted_tense: ["present", "past"]
    historical:
      permitted_temperature: ["cold", "measured"]
      permitted_tense: ["past"]

# --- Heading Discipline ---
heading_discipline:
  max_depth: 3  # section, subsection, subsubsection
  fragmentation_threshold: 0.3  # headings/paragraphs ratio
  note: "Use shallowest hierarchy that preserves argument structure"

# --- Anti-Genericity Scoring ---
anti_genericity:
  sentence_uniformity_flag: 5.0  # Flag if sentence length std < this
  ai_phrase_risk_weight: 0.15  # Per AI phrase found
  transition_chain_risk_weight: 0.10
  heading_fragmentation_risk_weight: 0.20
  uniform_paragraph_risk_weight: 0.15
  overall_risk_threshold: 0.4  # Score above this triggers review
